<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그슨대 · 공통 맵 아트</title><style>*{box-sizing:border-box}body{margin:0;background:#101722;color:#e1e9dc;font:15px/1.7 system-ui}main{max-width:1180px;margin:auto;padding:32px 20px}small{color:#9ebfaf;letter-spacing:3px}h1{margin:7px 0;font-size:32px}p{color:#99aeb4}canvas{display:block;width:100%;image-rendering:pixelated;background:#101925}.viewer{border:1px solid #40535d}.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:#1b2a35;padding:14px}select{background:#283e47;border:1px solid #6b877f;padding:8px;color:#e1e9dc}input{accent-color:#afc6a9}label{display:flex;align-items:center;gap:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}article{border:1px solid #364c56;background:#172531;cursor:pointer}h3{margin:12px 15px;font-size:16px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}main{padding:20px 12px}}</style><main><small>GEUSEUNDAE / SHARED ENVIRONMENT ART</small><h1>같은 흉가, 다른 방.</h1><p>승인한 맵의 기와·돌담·목재·등불을 공통 에셋으로 적용했습니다. 아래 화면은 Godot의 실제 그리기 좌표를 사용한 아트 검수용 미리보기입니다.</p><div class="viewer"><canvas id="stage" width="768" height="432"></canvas><div class="bar"><select aria-label="방 선택" id="room"></select><label>좌우 <input id="x" aria-label="카메라 좌우" type="range" min="0" max="1" step=".001" value=".5"></label><label>높이 <input id="y" aria-label="카메라 높이" type="range" min="0" max="1" step=".001" value=".7"></label></div></div><div class="grid" id="grid"></div><p>방 연결·포탈 간격·이동 판정은 유지했습니다. 캐릭터·몹은 제외한 맵 아트만 표시합니다.</p></main><script>
(async()=>{const rooms=await (await fetch('assets/maps/room-art-review.json')).json();const images={};for(const name of [...new Set(rooms.flatMap(r=>r.commands.filter(c=>c.texture).map(c=>c.texture)))]){const im=new Image();im.src='godot/'+name.replace('res://','');await im.decode();images[name]=im;}
function paint(ctx,room){for(const c of room.commands){if(c.fill){ctx.fillStyle='#'+c.fill;ctx.fillRect(...c.dest)}else{ctx.save();const v=c.tint;ctx.globalAlpha=v[3];ctx.filter='brightness('+((v[0]+v[1]+v[2])/3)+')';ctx.drawImage(images[c.texture],...c.source,...c.dest);ctx.restore()}}}
const select=document.querySelector('#room'),stage=document.querySelector('#stage'),x=document.querySelector('#x'),y=document.querySelector('#y');let selected=rooms.findIndex(r=>r.id==='courtyard');
function update(){const r=rooms[selected],ctx=stage.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,768,432);ctx.save();ctx.translate(-Number(x.value)*(r.width-768),-Number(y.value)*(864-432));paint(ctx,r);ctx.restore();select.value=selected;}
rooms.forEach((r,i)=>{const option=document.createElement('option');option.value=i;option.textContent=r.name;select.append(option);const card=document.createElement('article');card.innerHTML='<h3>'+r.name+'</h3><canvas width="480" height="240"></canvas>';document.querySelector('#grid').append(card);const ctx=card.querySelector('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;ctx.scale(480/r.width,240/864);paint(ctx,r);card.onclick=()=>{selected=i;update();window.scrollTo({top:0,behavior:'smooth'})}});select.onchange=()=>{selected=Number(select.value);update()};x.oninput=y.oninput=update;update();})();
</script></html>
