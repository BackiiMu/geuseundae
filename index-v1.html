<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그슨대 · 귀형 연구</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101118;color:#e9e5d4;font:15px/1.7 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:48px 30px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #32323e;padding-bottom:24px}.eyebrow{font-size:11px;letter-spacing:4px;color:#91c9bb}h1{font-size:46px;letter-spacing:-3px;margin:6px 0}h2{font-size:22px;margin:35px 0 16px}p{color:#9c9ca8;margin:5px 0}button,a.download{border:1px solid #4d5259;background:#1b2329;color:#bcd9cd;padding:9px 16px;cursor:pointer;text-decoration:none;border-radius:3px}button:hover,a.download:hover{background:#303f43}button.active{background:#91c9bb;color:#101118}.stage{margin-top:25px;border:1px solid #373743;background:#151620;position:relative}#stage{width:100%;display:block;image-rendering:pixelated;aspect-ratio:3/1}.stage-label{position:absolute;top:15px;left:20px;font-size:11px;color:#999da9;letter-spacing:2px}.controls{display:flex;gap:8px;flex-wrap:wrap;padding:16px;border-top:1px solid #34343e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid #31333f;background:#171923;padding:20px}.card canvas{width:100%;height:180px;object-fit:contain;image-rendering:pixelated;background:radial-gradient(ellipse at 50% 80%,#293039,transparent 65%)}h3{font-size:18px;margin:12px 0 4px}.tag{color:#91c9bb;font-size:11px;letter-spacing:2px}.fx{grid-template-columns:repeat(4,1fr)}.fx canvas{height:140px}.card a{color:#a5b9b4;font-size:12px}footer{border-top:1px solid #34343f;margin-top:35px;padding-top:20px;font-size:12px;color:#858995}@media(max-width:700px){main{padding:25px 16px}.grid,.fx{grid-template-columns:repeat(2,1fr)}h1{font-size:36px}header{align-items:flex-start}.card{padding:12px}.controls button{font-size:12px;padding:8px}#stage{aspect-ratio:2/1}}
</style><main><header><div><div class="eyebrow">GEUSEUNDAE / ART STUDY 001</div><h1>빌린 모습, 뒤틀린 힘.</h1><p>그슨대 · 캐릭터 & 전투 이펙트 첫 시안</p></div><button id="pause">Ⅱ 일시정지</button></header>
<div class="stage"><span class="stage-label">흉가 앞마당 / COMBAT PREVIEW</span><canvas id="stage" width="600" height="200"></canvas><div class="controls"><button class="active" data-fx="hair-whip">1 · 머리카락 채찍</button><button data-fx="shadow-dash">2 · 그림자 대시</button><button data-fx="corruption">3 · 오염 폭발</button><button data-fx="purifying-talisman">4 · 정화 부적</button><button id="bg">배경 전환</button></div></div>
<h2>귀신과 퇴마사 <span class="tag">CHARACTERS / 64 × 64</span></h2><div class="grid" id="characters"></div>
<h2>공격의 흔적 <span class="tag">EFFECTS / 128 × 96</span></h2><div class="grid fx" id="effects"></div>
<footer>초기 아트 시안 · 캐릭터 대기 6프레임 / 이펙트 12프레임 · 투명 PNG + 프레임 JSON 제공<br>기획서의 색·실루엣 대비와 <a href="https://patch-gg.github.io/pixelfx/" style="color:#91c9bb">pixelfx</a>의 코드 기반 픽셀 이펙트 접근을 참고한 자체 제작 시안. 전투 장면은 연출 미리보기입니다.</footer></main>
<script>
const specs={songaksi:[64,64,6,8,'손각시를 빌린 그슨대','PLAYER / HAIR','큰 상복 아래 드러난 아이 발. 머리카락 뒤 붉은 한쪽 눈.'],dosa:[64,64,6,8,'부적 도사','ENEMY / RANGED','검은 관모와 흰 도포. 붉은 부적으로 거리를 유지하는 적.'],mudang:[64,64,6,8,'방울 무당','ENEMY / SUPPORT','금빛 방울과 붉은 띠. 굿으로 퇴마 진영을 강화하는 적.'],'hair-whip':[128,96,12,18,'머리카락 채찍','HAIR / STRIKE','여러 가닥이 뒤늦게 따라오는 중거리 타격.'],'shadow-dash':[128,96,12,18,'그림자 대시','SHADOW / EVADE','몸이 바닥으로 스며들며 청록색 흔적을 남긴다.'],corruption:[128,96,12,18,'오염 폭발','CURSE / BURST','원한이 터지며 파편과 기운이 바깥으로 번진다.'],'purifying-talisman':[128,96,12,18,'정화 부적','HOLY / PROJECTILE','한지 바탕과 붉은 글씨. 귀신의 청록 기운과 대비.']};
const images={},cards=[];let paused=false,time=0,last=0,selected='hair-whip',light=false;
for(const [name,s] of Object.entries(specs)){const im=new Image();im.src='assets-v1/'+name+'.png';images[name]=im;const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="tag">${s[5]}</div><canvas width="${s[0]}" height="${s[1]}"></canvas><h3>${s[4]}</h3><p>${s[6]}</p><a href="assets-v1/${name}.png" download>PNG 시트 ↓</a>　<a href="assets-v1/${name}.json" download>프레임 JSON ↓</a>`;document.getElementById(s[0]===64?'characters':'effects').append(card);cards.push([name,card.querySelector('canvas')]);}
function draw(ctx,name,f,x,y,scale=1,flip=false,alpha=1){const s=specs[name],im=images[name];if(!im.complete||!im.naturalWidth)return;ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha=alpha;ctx.translate(Math.round(x),Math.round(y));if(flip)ctx.scale(-1,1);ctx.drawImage(im,(f%s[2])*s[0],0,s[0],s[1],flip?-s[0]*scale:0,0,s[0]*scale,s[1]*scale);ctx.restore()}
const stage=document.querySelector('#stage'),ctx=stage.getContext('2d');
function render(ms){if(!last)last=ms;if(!paused)time+=Math.min(.05,(ms-last)/1000);last=ms;
for(const [name,c]of cards){const s=specs[name],g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);draw(g,name,Math.floor(time*s[3]),0,0)}
ctx.fillStyle=light?'#b4b5ac':'#151620';ctx.fillRect(0,0,600,200);
// tiled roof, broken timber and a low wall
ctx.fillStyle=light?'#838981':'#20232c';ctx.fillRect(0,95,600,65);ctx.fillStyle=light?'#676f69':'#292c35';for(let x=0;x<600;x+=28){ctx.fillRect(x,115,25,3);ctx.fillRect(x+8,130,24,3)}
ctx.fillStyle=light?'#59605d':'#32313c';ctx.fillRect(66,43,7,117);ctx.fillRect(189,43,7,117);ctx.fillRect(70,52,120,6);ctx.fillStyle='#20212a';ctx.fillRect(98,67,60,92);ctx.fillStyle='#383844';ctx.fillRect(125,67,3,92);ctx.fillStyle=light?'#777a70':'#292a32';ctx.beginPath();ctx.moveTo(42,48);ctx.lineTo(128,18);ctx.lineTo(217,48);ctx.closePath();ctx.fill();ctx.fillStyle='#45404a';ctx.fillRect(45,46,170,4);
ctx.fillStyle=light?'#68726c':'#35373d';ctx.fillRect(0,164,600,3);ctx.fillStyle=light?'#84887c':'#20232b';ctx.fillRect(0,167,600,33);for(let i=0;i<60;i++){ctx.fillStyle=i%3?'#3e4142':'#545254';ctx.fillRect((i*137)%600,173+(i*7)%25,3,1)}
const cycle=time%2,hit=selected==='hair-whip'&&cycle>.3&&cycle<.65,fr=Math.min(11,Math.floor(cycle*18));let px=242;if(selected==='shadow-dash')px+=Math.min(70,cycle*110);
draw(ctx,'songaksi',Math.floor(time*8),px,110);draw(ctx,'dosa',Math.floor(time*8),354+(hit?5:0),110,1,true);draw(ctx,'mudang',Math.floor(time*8),448,110,1,true);
if(cycle<.7){if(selected==='purifying-talisman')draw(ctx,selected,fr,270,103,1,true);else draw(ctx,selected,fr,px+18,100)}
ctx.fillStyle='#91c9bb';ctx.font='8px monospace';ctx.fillText('GEUSEUNDAE',px-1,100);ctx.fillStyle='#e1b66f';ctx.fillText('DOSA',367,100);ctx.fillText('MUDANG',458,100);
requestAnimationFrame(render)}requestAnimationFrame(render);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ 재생':'Ⅱ 일시정지'};
document.querySelector('#bg').onclick=()=>light=!light;
function choose(name){selected=name;time=0;document.querySelectorAll('[data-fx]').forEach(b=>b.classList.toggle('active',b.dataset.fx===name))}document.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>choose(b.dataset.fx));window.addEventListener('keydown',e=>{if(/^[1-4]$/.test(e.key))choose(Object.keys(specs).slice(3)[Number(e.key)-1])});
</script></html>
