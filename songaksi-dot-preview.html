<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>손각시 도트 시안</title>
<style>:root{--bg:#0a0d12;--p:#141a22;--l:#2b3542;--ink:#d8cfbd;--dim:#8f8a7e;--acc:#c9a55c}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans KR",system-ui,sans-serif}.w{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:18px;margin:0}.s{color:var(--dim);margin:2px 0 14px;font-size:13px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}
.box{background:var(--p);border:1px solid var(--l);padding:10px}.box h2{font-size:13px;color:var(--acc);margin:0 0 2px}.box p{margin:0 0 6px;font-size:12px;color:var(--dim)}
canvas{width:100%;aspect-ratio:3/4;image-rendering:pixelated;background:#1c1f2b;display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{background:var(--p);color:var(--ink);border:1px solid var(--l);padding:6px 12px;font:inherit;cursor:pointer;border-radius:3px}button.on{border-color:var(--acc);color:var(--acc)}
.bg{display:flex;gap:6px;align-items:center;margin:0 0 12px;color:var(--dim);font-size:12px}</style></head><body><div class="w">
<h1>손각시 도트 시안</h1><p class="s">기존 포즈 32장을 그대로 두고 배경 안개를 지운 뒤 축소·색 제한·외곽선을 넣은 도트 시트입니다. 게임에는 적용하지 않은 시안입니다. <span id="fr"></span></p>
<div class="bar" id="bar"></div>
<div class="bg">배경 <button id="b1" class="on">어두운 바닥</button><button id="b2">흉가 배경</button></div>
<div class="row">
<div class="box"><h2>현재 게임</h2><p>192×256칸 · 원래 래스터 시트(복원됨)</p><canvas id="a"></canvas></div>
<div class="box"><h2>도트 A</h2><p>96×128칸 · 28색 (½ 축소)</p><canvas id="b"></canvas></div>
<div class="box"><h2>도트 B</h2><p>64×85칸 · 22색 (⅓ 축소, 더 거침)</p><canvas id="c"></canvas></div></div>
</div><script>
const L=s=>{const i=new Image();i.src=s;return i};
const old=L('godot/assets/actors/source/songaksi-v1.png'),p2=L('docs/mockups/songaksi-dot/songaksi-px2.png'),p3=L('docs/mockups/songaksi-dot/songaksi-px3.png'),yard=L('godot/assets/ui/title/title-background-v1.png');
const ANI=[['대기',0,7,7],['달리기',8,15,12],['공격',16,23,10],['피격',24,24,1],['점프',25,25,1],['낙하',26,26,1],['착지',27,27,1],['대시',28,29,14],['휘청',30,31,10]];
let cur=0,bg=0;const bar=document.getElementById('bar');
ANI.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a[0]+' '+a[1]+(a[1]!=a[2]?'~'+a[2]:'');b.onclick=()=>{cur=i;[...bar.children].forEach((c,j)=>c.classList.toggle('on',j==i))};bar.appendChild(b)});bar.children[0].classList.add('on');
const set=n=>{bg=n;b1.classList.toggle('on',!n);b2.classList.toggle('on',!!n)};b1.onclick=()=>set(0);b2.onclick=()=>set(1);
// 칸 크기가 달라도 같은 높이(256 기준)로 맞춰 그린다
const T=[[document.getElementById('a'),old,192,256],[document.getElementById('b'),p2,96,128],[document.getElementById('c'),p3,64,85]];
T.forEach(([c])=>{c.width=192;c.height=256});
function loop(t){const[,f0,f1,fps]=ANI[cur],f=f0+Math.floor(t/1000*fps)%(f1-f0+1);
 T.forEach(([c,im,w,h])=>{const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,192,256);
  if(bg&&yard.complete)g.drawImage(yard,150,200,420,560,0,0,192,256);
  if(im.complete)g.drawImage(im,(f%8)*w,Math.floor(f/8)*h,w,h,0,0,192,256)});
 document.getElementById('fr').textContent='프레임 '+f;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
