<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가방 조작 개선 시안</title>
<style>
:root{--bg:#0a0d12;--panel:#141a22;--line:#2b3542;--ink:#d8cfbd;--dim:#8f8a7e;--acc:#c9a55c;--bad:#c9614f;--ok:#7fb58a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans KR",system-ui,sans-serif;user-select:none}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--dim);margin:0 0 12px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button.m{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:6px 12px;font:inherit;cursor:pointer;border-radius:3px}
button.m.on{border-color:var(--acc);color:var(--acc)}
.grid2{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:16px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.inv{position:relative;width:520px;height:340px;background:#241713;border:3px solid #6e2a22;display:grid;grid-template-columns:150px 1fr;gap:8px;padding:8px}
.eq{background:#1a1210;border:1px solid #4a2a22;padding:6px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;align-content:start}
.eq h4,.bagh h4{grid-column:1/-1;margin:0;font-size:12px;color:var(--acc);font-weight:600}
.slot{width:100%;aspect-ratio:1;background:#17232d;border:1px solid #59655e;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.slot img{max-width:80%;max-height:80%;image-rendering:pixelated;pointer-events:none}
.slot.empty{opacity:.55}.slot.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.slot small{position:absolute;left:2px;top:0;font-size:9px;color:#8a8070;pointer-events:none}
.slot.over{border-color:var(--ok);background:#1d3228}
.slot.ghost{opacity:.25}
.bagh{display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;background:#1a1210;border:1px solid #4a2a22;padding:6px;touch-action:pan-y}
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.detail{grid-column:1/-1;display:flex;gap:10px;align-items:center;background:#1a1210;border:1px solid #4a2a22;padding:6px 8px;height:64px}
.detail .slot{width:48px;flex:none}.detail b{color:#f0dcae}.detail span{font-size:12px;color:var(--dim)}
.detail .btns{margin-left:auto;display:flex;gap:6px}
.detail button{background:#3a2218;color:#e7dcc5;border:1px solid #7a4a30;padding:4px 12px;cursor:pointer;font:inherit}
.float{position:fixed;width:40px;height:40px;pointer-events:none;z-index:9;background:#17232dcc;border:1px solid var(--acc);display:flex;align-items:center;justify-content:center}
.float img{max-width:80%;max-height:80%;image-rendering:pixelated}
.log{background:var(--panel);border:1px solid var(--line);padding:10px 14px;font-size:13px}
.log h3{font-size:14px;margin:0 0 6px;color:var(--acc)}
.log li{margin:3px 0}.bad{color:var(--bad)}.ok{color:var(--ok)}
code{background:#18202a;padding:0 4px;font-size:12px}
#msg{height:22px;color:var(--acc);font-size:13px;margin-top:6px}
</style>
</head>
<body><div class="wrap">
<h1>가방 조작 개선 시안</h1>
<p class="sub">가방에서 불편하다고 하신 세 가지(드래그가 부자연스러움, 아이템을 누르면 강제로 위로 올라감, 아이템 위치가 자꾸 바뀜)를 같은 화면에서 <b>현재 동작</b>과 <b>개선안</b>으로 비교합니다. 게임에는 적용하지 않았습니다.</p>
<div class="bar"><button class="m" id="mCur">현재 동작(재현)</button><button class="m on" id="mNew">개선안</button><button class="m" id="reset">처음 상태로</button></div>
<div class="grid2">
<div>
 <div class="inv" id="inv">
  <div class="eq" id="eq"><h4>장착</h4></div>
  <div class="bagh"><h4>가방 <span id="cnt" style="color:var(--dim);font-weight:400"></span></h4><div class="scroll" id="scroll"><div class="bag" id="bag"></div></div></div>
  <div class="detail" id="detail"></div>
 </div>
 <div id="msg"></div>
</div>
<div class="log" id="log"></div>
</div></div>
<script>
const IC='godot/assets/gear3/icons/';
const ITEMS=[['nails','몽달의 손톱','main','mongdalNail'],['goose','부러진 나무기러기','main','woodGoose'],['call','창귀의 부름','off','changgwiBell'],['tongue','아귀의 혀','off','agwiTongue'],['club','도깨비방망이','main','dokkaebiClub'],['broom','낡은 빗자루','off','oldBroom'],['belt','씨름 샅바','two','ssireumSash'],['shadow','어둑한 그림자','main','murkShadow'],['voice','흉내 내는 목소리','off','mimicVoice'],['whistle','가는 휘파람','main','thinWhistle'],['mouth','거구귀의 입','two','giantMouth'],['well','우물 두레박','two','wellBucket'],['fire','여우불','off','foxFire'],['mirror','둔갑 거울','off','shapeMirror'],['han','몽달의 한','off','mongdalHan'],['water','물귀신의 손','off','drownedHand'],['tooth','아귀의 이빨','main','agwiTeeth'],['soul','홀린 넋','off','boundSoul'],['paw','장산범의 앞발','main','jangsanPaw'],['fang','범의 송곳니','two','tigerFang']];
const mk=([id,name,slot,ic])=>({id,name,slot,src:IC+ic+'.png'});
const SLOTS=[['main','주무기'],['off','보조무기']];
let mode='new',bag,eq,sel,drag=null;
function reset(){bag=ITEMS.map(mk);while(bag.length<36)bag.push(null);eq={main:null,off:null};sel=2;render(true)}
const $=id=>document.getElementById(id);
function say(t){$('msg').textContent=t}
function slotEl(item,cls=''){const d=document.createElement('div');d.className='slot '+cls+(item?'':' empty');if(item){const i=new Image();i.src=item.src;d.appendChild(i)}return d}
function render(first){
  const sc=$('scroll'),keep=sc.scrollTop;
  // 현재 동작: 매번 전부 다시 만들며 스크롤이 맨 위로 돌아간다. 개선안: 스크롤 위치를 보존한다.
  const eqEl=$('eq');eqEl.innerHTML='<h4>장착</h4>';
  SLOTS.forEach(([k,label])=>{const d=slotEl(eq[k]);d.dataset.eq=k;const s=document.createElement('small');s.textContent=label;d.appendChild(s);if(!eq[k])d.classList.add('empty');eqEl.appendChild(d)});
  const b=$('bag');b.innerHTML='';
  bag.forEach((it,i)=>{const d=slotEl(it);d.dataset.bi=i;if(i===sel&&it)d.classList.add('sel');if(drag&&drag.from===i)d.classList.add('ghost');b.appendChild(d)});
  $('cnt').textContent=`(${bag.filter(Boolean).length}/${bag.length})`;
  const dt=$('detail');dt.innerHTML='';const it=bag[sel];
  if(it){const s=slotEl(it);dt.appendChild(s);const t=document.createElement('div');t.innerHTML=`<b>${it.name}</b><br><span>${{main:'오른손',off:'왼손',two:'양손'}[it.slot]}</span>`;dt.appendChild(t);
    const bt=document.createElement('div');bt.className='btns';bt.innerHTML='<button id="eqb">장착</button><button>파기</button>';dt.appendChild(bt)}
  else dt.innerHTML='<span>비어 있는 칸입니다</span>';
  const eb=$('eqb');if(eb)eb.onclick=()=>equip(sel);
  if(mode==='cur'&&!first)sc.scrollTop=0; else sc.scrollTop=keep;
}
// 장착: 현재는 가방에서 빼서 뒤 칸이 앞으로 밀리고 교체된 장비는 맨 뒤로 간다. 개선안은 그 칸에 그대로 교체한다.
function equip(i){
  const it=bag[i];if(!it)return;const k=it.slot==='off'?'off':'main';
  if(mode==='cur'){bag.splice(i,1);const old=eq[k];eq[k]=it;if(old)bag.push(old);bag.push(null);say('현재: 장착하니 뒤 칸이 모두 한 칸씩 앞으로 밀리고, 교체된 장비는 맨 뒤로 갔습니다')}
  else{const old=eq[k];eq[k]=it;bag[i]=old||null;say(old?'개선안: 교체된 장비가 방금 비운 그 칸으로 들어왔습니다':'개선안: 장착한 칸이 그 자리에서 비었고 나머지는 그대로입니다')}
  render();
}
function unequip(k){const it=eq[k];if(!it)return;
  if(mode==='cur'){const e=bag.findIndex(x=>!x);bag.splice(e<0?bag.length:e,0,it);bag.pop();say('현재: 해제한 장비는 맨 뒤로 갑니다')}
  else{const e=bag.findIndex(x=>!x);if(e<0){say('가방이 가득 찼습니다');return}bag[e]=it;say('개선안: 해제한 장비는 가장 앞의 빈 칸으로 들어갑니다')}
  eq[k]=null;render();
}
// 입력: 마우스는 6px 움직이면 바로 집어 들고, 터치는 0.25초 누르면 집어 든다(그 전에 움직이면 스크롤).
let press=null,timer=null;
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.slot');if(!t)return;
  const bi=t.dataset.bi,ek=t.dataset.eq;
  const item=bi!=null?bag[+bi]:ek?eq[ek]:null;
  press={x:e.clientX,y:e.clientY,bi:bi!=null?+bi:null,ek,item,touch:e.pointerType==='touch',started:false};
  if(mode==='new'&&item&&press.touch)timer=setTimeout(()=>start(e),250);
});
document.addEventListener('pointermove',e=>{
  if(!press)return;
  const moved=Math.hypot(e.clientX-press.x,e.clientY-press.y);
  if(drag){fl.style.left=e.clientX-20+'px';fl.style.top=e.clientY-20+'px';
    document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
    const o=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');if(o&&(o.dataset.bi!=null||o.dataset.eq))o.classList.add('over');return}
  if(mode==='new'&&press.item&&!press.touch&&moved>6)start(e);
  if(mode==='new'&&press.touch&&moved>8&&!press.started){clearTimeout(timer)}   // 터치: 길게 누르기 전에 움직이면 스크롤
  if(mode==='cur'&&press.item&&!press.touch&&moved>6&&!press.warned){press.warned=true;say('현재: 마우스로 끌어도 아이템이 움직이지 않고, 스크롤도 되지 않습니다(휠·스크롤바만 됨)')}
});
let fl=null;
function start(e){if(drag||!press||!press.item)return;press.started=true;drag={from:press.bi,eq:press.ek,item:press.item};
  fl=document.createElement('div');fl.className='float';const i=new Image();i.src=drag.item.src;fl.appendChild(i);document.body.appendChild(fl);fl.style.left=e.clientX-20+'px';fl.style.top=e.clientY-20+'px';render()}
document.addEventListener('pointerup',e=>{
  clearTimeout(timer);
  if(drag){
    const o=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');
    if(o){
      if(o.dataset.bi!=null){const to=+o.dataset.bi;
        if(drag.eq){const dst=bag[to];if(!dst||(dst.slot==='off'?'off':'main')===drag.eq){eq[drag.eq]=dst||null;bag[to]=drag.item;say('장착한 장비를 가방의 원하는 칸에 놓았습니다')}}
        else if(drag.from!==to){const tmp=bag[to];bag[to]=bag[drag.from];bag[drag.from]=tmp;sel=to;say(tmp?'두 칸의 아이템을 서로 바꿨습니다':'빈 칸으로 옮겼습니다. 나머지는 움직이지 않습니다')}}
      else if(o.dataset.eq&&drag.from!=null){const k=o.dataset.eq,ok=(drag.item.slot==='off'?'off':'main')===k||drag.item.slot==='two'&&k==='main';
        if(ok){const old=eq[k];eq[k]=drag.item;bag[drag.from]=old||null;say('끌어서 장착했습니다')}else say('이 칸에는 장착할 수 없는 장비입니다')}}
    fl.remove();drag=null;press=null;render();return}
  if(press&&press.item){ // 클릭 = 선택만. 스크롤은 건드리지 않는다.
    if(press.bi!=null){sel=press.bi;render();say(mode==='cur'?'현재: 아이템을 선택하면 가방 목록이 맨 위로 되돌아갑니다(아래쪽 칸에서 눌러 보세요)':'개선안: 선택해도 스크롤 위치가 그대로입니다')}
    else if(press.ek)unequip(press.ek)}
  press=null;
});
document.addEventListener('dblclick',e=>{const t=e.target.closest('.slot');if(t&&t.dataset.bi!=null&&bag[+t.dataset.bi])equip(+t.dataset.bi)});
function logs(){$('log').innerHTML=mode==='cur'?`<h3>현재 동작(코드 기준)</h3><ul>
<li class="bad"><b>강제로 위로 이동:</b> 아이템을 누르면 <code>select_inventory()</code>가 <code>refresh_inventory()</code>로 인벤토리 전체를 지우고 다시 만들며, 가방 스크롤 칸(ScrollContainer)도 새로 만들어져 스크롤이 맨 위로 돌아갑니다.</li>
<li class="bad"><b>아이템 위치가 바뀜:</b> 장착은 <code>bag.remove_at(i)</code>로 뒤 칸이 모두 앞으로 밀리고, 교체된 장비·해제한 장비는 <code>bag.append()</code>로 맨 뒤에 붙습니다. 파기도 뒤 칸이 밀립니다.</li>
<li class="bad"><b>드래그 부자연스러움:</b> 아이템을 끌어 옮기는 기능이 아예 없습니다. 칸은 누르기(선택)만 되고, 스크롤은 마우스 휠·스크롤바·터치 스와이프만 됩니다. 마우스로 끌면 아무 일도 일어나지 않습니다.</li></ul>
<p class="sub">왼쪽 가방을 아래로 스크롤해 아래쪽 아이템을 눌러 보세요(맨 위로 튑니다). 장착을 눌러 보세요(칸이 밀립니다).</p>`
:`<h3>개선안</h3><ul>
<li class="ok"><b>스크롤 유지:</b> 선택할 때 스크롤 칸을 새로 만들지 않고 스크롤 위치를 저장했다가 복원합니다(선택 표시와 상세만 갱신).</li>
<li class="ok"><b>위치 고정:</b> 가방을 빈 칸이 있는 고정 칸 배열로 바꿉니다. 장착하면 그 칸에 교체된 장비가 들어가고(없으면 빈 칸), 해제한 장비·새로 얻은 장비는 가장 앞의 빈 칸에 들어갑니다. 아무것도 밀리지 않습니다.</li>
<li class="ok"><b>자연스러운 드래그:</b> 칸을 끌면 아이템이 손에 들려 다른 칸(위치 교환·빈 칸 이동)이나 장착 칸(장착)에 놓입니다. 마우스는 6px 움직이면 바로 들리고, 터치는 0.25초 길게 누르면 들리며 그 전에 밀면 스크롤이 됩니다. 더블클릭은 바로 장착입니다.</li></ul>
<p class="sub">아이템을 끌어 다른 칸·장착 칸에 놓아 보세요. 장착 칸을 누르면 해제됩니다. 터치 기기는 길게 눌러 집으세요.</p>
<p class="sub">반영 범위: <code>world.wallet["bag"]</code>이 지금은 빈 칸 없는 배열이라, 습득·상점·보상·파기·시험장 코드가 모두 이 배열을 씁니다. 고정 칸으로 바꾸려면 이 호출부와 테스트를 함께 고쳐야 합니다.</p>`}
function setMode(m){mode=m;$('mCur').classList.toggle('on',m==='cur');$('mNew').classList.toggle('on',m==='new');logs();reset();say('')}
$('mCur').onclick=()=>setMode('cur');$('mNew').onclick=()=>setMode('new');$('reset').onclick=()=>{reset();say('')};
logs();reset();
</script></body></html>
