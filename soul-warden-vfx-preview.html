<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>그슨대 — 쇄혼대감 원혼 강제 인출</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#08070b;color:#d9d2c8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#211823 0,#0b090e 48%,#050407 100%)}
    main{width:min(94vw,900px);padding:20px}.title{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:10px}.title h1{font-size:18px;letter-spacing:.12em;margin:0;color:#e4ddd0}.title p{font-size:12px;margin:0;color:#8e8580}
    .frame{position:relative;overflow:hidden;border:1px solid #3b3034;background:#08080d;box-shadow:0 18px 55px #000b,0 0 0 4px #100d12;aspect-ratio:16/9}
    canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
    .tag{position:absolute;left:12px;top:10px;padding:5px 8px;background:#08070ac9;border-left:2px solid #7c3033;font-size:11px;letter-spacing:.08em;color:#c8bbb0}
    .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.controls button{appearance:none;border:1px solid #514145;background:#171217;color:#bfb4ab;padding:8px 12px;cursor:pointer;font:inherit;font-size:12px}.controls button:hover,.controls button.active{border-color:#8e4547;background:#29181b;color:#fff0df}.controls .spacer{flex:1}.note{margin:10px 0 0;color:#827a76;font-size:11px;line-height:1.6}
  </style>
</head>
<body>
<main>
  <div class="title"><h1>쇄혼대감 · 원혼 강제 인출</h1><p>실제 적용 시트 24 FPS / 640×360 기준</p></div>
  <div class="frame"><canvas width="640" height="360"></canvas><div class="tag" id="tag">포획 패턴 전조</div></div>
  <div class="controls">
    <button data-pattern="포획 패턴 전조" class="active">패턴 1 · 포획</button>
    <button data-pattern="봉인말뚝 전개">패턴 2 · 말뚝</button>
    <button data-pattern="심장 강제 추출">패턴 3 · 심장</button>
    <span class="spacer"></span><button id="replay">다시 보기</button><button id="toggle">일시정지</button>
  </div>
  <p class="note">봉인목에서 억눌린 귀신 셋이 기어 나오고, 괴로워하며 저항하다가 붉은 구속선에 묶여 쇄혼대감의 손으로 압축됩니다. 세 패턴 모두 이 전조를 공유합니다.</p>
</main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const actor=new Image(),sheet=new Image();actor.src='godot/assets/actors/chapter3/soul-warden-game-v1.png';sheet.src='godot/assets/monster_vfx/warden-forced-souls.png';
let atlas=null,start=performance.now(),paused=false,pauseAt=0,lastFrame=-1;
fetch('godot/assets/monster_vfx/warden-forced-souls.json').then(r=>r.json()).then(j=>atlas=j);
function mist(t){ctx.save();for(let i=0;i<7;i++){const x=((i*137+t*(5+i%3))%760)-60,y=84+i*31;ctx.globalAlpha=.035+i*.006;ctx.fillStyle=i%2?'#958b9c':'#686479';ctx.beginPath();ctx.ellipse(x,y,78+i*6,9+i%3*4,0,0,Math.PI*2);ctx.fill()}ctx.restore()}
function world(t){
  ctx.fillStyle='#090a10';ctx.fillRect(0,0,640,360);const g=ctx.createLinearGradient(0,0,0,300);g.addColorStop(0,'#13131c');g.addColorStop(.65,'#0b0b11');g.addColorStop(1,'#151116');ctx.fillStyle=g;ctx.fillRect(0,0,640,310);
  ctx.fillStyle='#17131a';ctx.fillRect(0,268,640,92);ctx.fillStyle='#29212a';ctx.fillRect(0,268,640,3);for(let x=0;x<640;x+=32){ctx.fillStyle=x%64?'#1e181f':'#211a22';ctx.fillRect(x,278+(x%3),30,2)}
  mist(t);ctx.fillStyle='#06060899';ctx.fillRect(0,0,640,42);ctx.fillRect(0,330,640,30);
}
function draw(now){requestAnimationFrame(draw);if(!atlas||!actor.complete||!sheet.complete)return;const elapsed=paused?pauseAt:(now-start)/1000;world(elapsed);
  const actorW=132,actorH=120,actorX=320-66,actorY=270-120;ctx.save();ctx.globalAlpha=.28;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(329,272,52,9,0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.drawImage(actor,actorX,actorY,actorW,actorH);
  const cycle=3.25,anim=elapsed%cycle,duration=atlas.frames.length/24;let frame=anim<duration?Math.min(atlas.frames.length-1,Math.floor(anim*24)):-1;
  if(frame>=0){const f=atlas.frames[frame].frame;const pivot=atlas.meta.pixelfx.pivot;const px=333,py=270;ctx.drawImage(sheet,f.x,f.y,f.w,f.h,px-pivot[0],py-pivot[1],f.w,f.h)}lastFrame=frame;
  if(anim>=duration){ctx.fillStyle='#8d394122';ctx.beginPath();ctx.arc(372,210,10+Math.sin(elapsed*8)*2,0,Math.PI*2);ctx.fill()}
}
document.querySelectorAll('[data-pattern]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pattern]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('tag').textContent=b.dataset.pattern;start=performance.now();paused=false;document.getElementById('toggle').textContent='일시정지'});
document.getElementById('replay').onclick=()=>{start=performance.now();paused=false;document.getElementById('toggle').textContent='일시정지'};
document.getElementById('toggle').onclick=e=>{if(paused){start=performance.now()-pauseAt*1000;paused=false;e.target.textContent='일시정지'}else{pauseAt=(performance.now()-start)/1000;paused=true;e.target.textContent='계속 보기'}};
requestAnimationFrame(draw);
</script>
</body>
</html>
