<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>그슨대 · 던그리드식 공격감 참고 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090c12;color:#d9d2c4;font-family:system-ui,"Apple SD Gothic Neo",sans-serif}main{width:min(1100px,100%);margin:auto;padding:20px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.head h1{font-size:22px;margin:0 0 5px}.head p{font-size:13px;color:#8f9aa1;margin:0}.badge{color:#b9a98d;border:1px solid #4a443b;background:#171713;padding:7px 10px;font-size:12px}.tabs{display:flex;gap:8px;margin:16px 0 10px}.tabs button,.controls button{font:inherit;color:#aaa393;background:#171b21;border:1px solid #343b43;padding:9px 14px;cursor:pointer}.tabs button.on{color:#f0dfbd;border-color:#9b7650;background:#30251e}.stage{position:relative;border:1px solid #303844;background:#0c1119;box-shadow:0 8px 30px #0008}.stage:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#fff0 65%,#090d12 100%)}canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated}.info{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px;margin-top:10px}.card{min-height:112px;border:1px solid #2e343b;background:#11161d;padding:12px}.card strong{display:block;color:#e2ccb0;font-size:14px;margin-bottom:7px}.card p,.card li{font-size:12px;line-height:1.55;color:#9ea6a6;margin:0}.card ul{padding-left:17px;margin:0}.controls{display:flex;align-items:center;gap:8px;margin-top:10px}.controls span{font-size:12px;color:#78838b;margin-left:auto}.tune{display:flex;gap:16px;align-items:center;padding:10px 12px;border:1px solid #40382f;background:#171513}.tune label{display:flex;align-items:center;gap:7px;font-size:12px;color:#b8aa97}.tune input{width:130px;accent-color:#a36d45}.tune output{min-width:44px;color:#e3c79e}@media(max-width:720px){.info{grid-template-columns:1fr}.head{display:block}.badge{display:inline-block;margin-top:10px}.tune{flex-wrap:wrap}}
</style>
</head>
<body><main>
 <div class="head"><div><h1>1챕터 잡몹 · 던그리드식 공격감 참고 시안</h1><p>원본 리소스를 복사하지 않고 타이밍·궤적·히트스톱 구조만 우리 아트로 재구성</p></div><div class="badge">PIXELFX 원본 · 그슨대 팔레트 적용안</div></div>
 <div class="tabs"><button data-i="0" class="on">퇴마 무사</button><button data-i="1">목탁 승려</button><button data-i="2">부적 도사</button></div>
 <div class="stage"><canvas width="960" height="540"></canvas></div>
 <div class="controls"><button id="replay">다시 보기</button><button id="slow">0.5배</button><button id="freeze">타격 프레임 정지</button><button id="range">실제 판정 숨기기</button><span>자동 반복 · 키보드 1 / 2 / 3 전환</span></div>
 <div class="tune" id="warriorTune"><label>위치 X <input id="wx" type="range" min="280" max="560" value="361"><output>361</output></label><label>위치 Y <input id="wy" type="range" min="300" max="470" value="388"><output>388</output></label><label>공격 속도 <input id="wr" type="range" min="50" max="200" value="100"><output>1.00×</output></label></div>
 <section class="info"><div class="card"><strong id="name"></strong><p id="desc"></p></div><div class="card"><strong>공격 리듬</strong><ul id="rhythm"></ul></div><div class="card"><strong>게임 적용 기준</strong><ul id="rules"></ul></div></section>
</main>
<script>
const C=document.querySelector('canvas'),x=C.getContext('2d');x.imageSmoothingEnabled=false;
const img=p=>{const i=new Image;i.src=p;return i}, actors=[img('godot/assets/actors/source/warrior-v1.png'),img('godot/assets/actors/source/monk-v1.png'),img('godot/assets/actors/source/adept-v1.png')];
const slash=img('docs/mockups/dungreed-feel-vfx/sword-slash.png'), moktak=img('godot/assets/monster_vfx/monk-moktak.png'), blunt=img('docs/mockups/dungreed-feel-vfx/blunt-hit.png'), talisman=img('docs/mockups/dungreed-feel-vfx/talisman-v2.png');
const modes=[
 {name:'퇴마 무사 · 눌러 베기',desc:'칼을 올려드는 동안에는 검광이 없고, 실제 칼날이 머리 위에서 아래로 내려오는 프레임에서만 검붉은 궤적이 나타난다.',wind:.22,hit:.42,end:.72,freeze:.085,rhythm:['0.22초 자세 낮추기','칼을 올릴 때 이펙트 없음','아래로 휘두르는 구간만 검광','적중 0.085초 정지'],rules:['기본 위치 X 361 · Y 388','반경 52·전방 단일 베기','회수 프레임에서 즉시 제거']},
 {name:'목탁 승려 · 기존 이펙트',desc:'기존 1챕터 시안처럼 0.9초 선대기가 끝난 뒤 목탁 모션과 동시에 monk-moktak 전체 시트를 재생한다. 준비 중 미리 퍼지던 충격파를 제거했다.',wind:.9,hit:.9,end:3.04,freeze:.11,rhythm:['0.90초 기존 선대기','목탁을 내리는 순간 이펙트 시작','64프레임을 중간 생략 없이 재생','동작과 먼지 고리가 함께 회수'],rules:['기존 시안 위치·크기 환산','몸 중심 판정 반경 45','준비 동작 중 이펙트 없음']},
 {name:'부적 도사 · 무지 네모 한지',desc:'안쪽 무늬와 인장 없이 낡은 한지색 네모 한 장이 형태 변화 없이 직선으로 날아간다. 흔들림·잔상·광채·마법진도 없다.',wind:1.1,hit:1.1,end:4.08,freeze:.045,rhythm:['1.10초 부적 선대기','초속 140 직선 이동','수명 2.98초 · 거리 약 417','적 행동 후딜 1.50초'],rules:['플레이어 중심 판정 반경 17','단일 정지 프레임','내부 무늬·펄럭임 없음']}
];
let selected=0,start=performance.now(),speed=1,hold=false,last=0,holdUntil=0,showRange=true,warrior={x:361,y:388,rate:1};
function activeMode(){const m=modes[selected];return selected===0?{...m,hit:m.wind+(m.hit-m.wind)/warrior.rate,end:m.wind+(m.end-m.wind)/warrior.rate}:m}
const actorWindows={0:{20:[9,192],21:[11,192],22:[16,176]},1:{21:[5,192],22:[21,171]},2:{29:[8,192],30:[9,183]}};
function actor(frame,px,py,scale=1){const a=actors[selected],fw=a.width/8,fh=a.height/4,win=(actorWindows[selected]||{})[frame]||[0,fw],cutX=win[0],cutW=win[1],sx=(frame%8)*fw+cutX,sy=Math.floor(frame/8)*fh;x.save();x.translate(px,py);x.scale(scale,scale);x.drawImage(a,sx,sy,cutW,fh,-fw/2+cutX,-fh,cutW,fh);x.restore()}
function sheet(image,frame,frames,fw,fh,cols,px,py,scale=1,alpha=1,filter='none',pivotX=fw/2,pivotY=fh*.72){frame=Math.max(0,Math.min(frames-1,frame));x.save();x.globalAlpha=alpha;x.filter=filter;x.translate(px,py);x.scale(scale,scale);x.drawImage(image,(frame%cols)*fw,Math.floor(frame/cols)*fh,fw,fh,-pivotX,-pivotY,fw,fh);x.restore()}
function scene(t){x.clearRect(0,0,960,540);let g=x.createLinearGradient(0,0,0,540);g.addColorStop(0,'#111b28');g.addColorStop(1,'#17141a');x.fillStyle=g;x.fillRect(0,0,960,540);x.fillStyle='#252a31';x.fillRect(0,414,960,126);x.fillStyle='#414047';for(let i=0;i<960;i+=64)x.fillRect(i,414,58,8);x.fillStyle='#141920';for(let i=0;i<960;i+=96)x.fillRect(i,448,88,3);
 const m=activeMode(),cycle=m.end+.55,local=(t%cycle),wind=local<m.wind,attack=local>=m.wind&&local<m.end;let af=wind?16+Math.min(3,Math.floor(local/m.wind*4)):attack?18+Math.floor((local-m.wind)/(m.end-m.wind)*5):0;if(selected===1&&attack)af=20+Math.min(3,Math.floor((local-m.hit)/(m.end-m.hit)*4));if(selected===2&&attack)af=local<m.hit+1.5?20+Math.min(3,Math.floor((local-m.hit)/1.5*4)):0;
 actor(af,330,414,.3125);x.fillStyle='#3a3030';x.fillRect(640,354,36,60);x.fillStyle='#7d5550';x.fillRect(645,360,26,50);
 if(selected===0&&attack){let swing=(local-m.wind)/(m.end-m.wind);if(swing>=.4&&swing<=.98){let q=(swing-.4)/.58,f=Math.floor(q*18);sheet(slash,f,24,136,104,5,warrior.x,warrior.y,1.55,.58,'sepia(1) saturate(.75) hue-rotate(315deg) brightness(.72)')}}
 if(selected===1&&local>=m.hit&&local<m.end){let f=Math.floor((local-m.hit)*30);sheet(moktak,f,64,288,208,7,335,410,1.375,1,'none',104,164)}
 if(selected===2&&attack){let age=local-m.hit,q=Math.min(1,age/2.98);sheet(talisman,0,1,26,30,1,330+q*521.5,383,1.875,1,'none',13,15)}
 if(showRange){x.save();x.setLineDash([9,7]);x.lineWidth=2;x.strokeStyle='#e0b46ccc';x.fillStyle='#bd5c4930';if(selected===0){x.beginPath();x.arc(365,383,47.5,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#f0ca8d';x.fillText('전방 중심 +28 · 반경 38',376,329)}else if(selected===1){x.beginPath();x.arc(332.5,383,56.25,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#f0ca8d';x.fillText('몸 중심 +2 · 반경 45',350,315)}else{x.beginPath();x.moveTo(330,383);x.lineTo(851.5,383);x.lineWidth=42.5;x.strokeStyle='#bd5c4930';x.stroke();x.setLineDash([9,7]);x.lineWidth=2;x.strokeStyle='#e0b46ccc';x.stroke();x.fillStyle='#f0ca8d';x.fillText('속도 140 · 수명 2.98초 · 거리 417 · 피격 반경 17',470,350)}x.restore()}
 x.fillStyle='#d5b77a';x.font='14px system-ui';x.fillText(wind?'예고':attack?'공격':'회수',26,34);x.fillStyle='#7f8991';x.fillText(`${local.toFixed(2)}s`,26,55);
}
function loop(now){let dt=(now-last)/1000;last=now;if(!hold){const m=activeMode(),cycle=m.end+.55,local=((now-start)/1000*speed)%cycle;if(local>=m.hit&&local<m.hit+.035){hold=true;holdUntil=now+m.freeze*1000;start+=m.freeze*1000}}else if(now>=holdUntil)hold=false;scene((now-start)/1000*speed);requestAnimationFrame(loop)}
function setMode(i){selected=i;start=performance.now();hold=false;document.querySelector('#warriorTune').style.display=i===0?'flex':'none';document.querySelectorAll('.tabs button').forEach((b,n)=>b.classList.toggle('on',n===i));const m=modes[i];document.querySelector('#name').textContent=m.name;document.querySelector('#desc').textContent=m.desc;document.querySelector('#rhythm').innerHTML=m.rhythm.map(v=>`<li>${v}</li>`).join('');document.querySelector('#rules').innerHTML=m.rules.map(v=>`<li>${v}</li>`).join('')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(+b.dataset.i));document.querySelector('#replay').onclick=()=>start=performance.now();document.querySelector('#slow').onclick=e=>{speed=speed===1?.5:1;e.target.textContent=speed===1?'0.5배':'1배'};document.querySelector('#freeze').onclick=()=>{hold=true;holdUntil=performance.now()+700};document.querySelector('#range').onclick=e=>{showRange=!showRange;e.target.textContent=showRange?'실제 판정 숨기기':'실제 판정 보기'};[['wx','x',v=>v],['wy','y',v=>v],['wr','rate',v=>v/100]].forEach(([id,key,convert])=>{const input=document.querySelector('#'+id),out=input.nextElementSibling;input.oninput=()=>{warrior[key]=convert(+input.value);out.value=key==='rate'?warrior[key].toFixed(2)+'×':input.value;start=performance.now()}});addEventListener('keydown',e=>{if('123'.includes(e.key))setMode(+e.key-1)});setMode(0);requestAnimationFrame(loop);
</script></body></html>
