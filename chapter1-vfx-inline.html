<div id="chapter1-vfx-preview" style="padding:16px;color:var(--foreground);font-family:system-ui,sans-serif">
  <div class="nav nav-pills nav-justified" role="tablist" aria-label="1챕터 적 선택">
    <button class="nav-link active" id="warrior-tab" type="button" role="tab" aria-controls="preview-panel" aria-selected="true">퇴마 무사</button>
    <button class="nav-link" id="adept-tab" type="button" role="tab" aria-controls="preview-panel" aria-selected="false">부적 도사</button>
    <button class="nav-link" id="monk-tab" type="button" role="tab" aria-controls="preview-panel" aria-selected="false">목탁 승려</button>
  </div>
  <div id="preview-panel" role="tabpanel" aria-labelledby="warrior-tab" style="margin-top:12px">
    <h3 id="fx-title">퇴마 무사 · 봉인 철검 베기</h3>
    <canvas id="fx-canvas" width="920" height="440" role="img" aria-label="퇴마 무사의 공격 이펙트 미리보기" style="width:100%;height:auto;display:block;background:#382933;image-rendering:pixelated"></canvas>
    <div class="viz-row" style="margin-top:10px;justify-content:space-between"><span id="fx-note" class="text-muted">칼이 완전히 붙은 포즈로 고정 · 이펙트만 재생</span><button class="btn" id="replay" type="button">다시 재생</button></div>
  </div>
</div>
<script>
(()=>{const root=document.getElementById('chapter1-vfx-preview'),canvas=root.querySelector('#fx-canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const tabs=[...root.querySelectorAll('[role=tab]')],title=root.querySelector('#fx-title'),note=root.querySelector('#fx-note');const info=[['퇴마 무사 · 봉인 철검 베기','칼이 완전히 붙은 포즈로 고정 · 이펙트만 재생'],['부적 도사 · 주홍 부적 사출','펼친 부적이 천천히 직선으로 전진'],['목탁 승려 · 목탁 충격','중심 고리만 판정 · 바깥 잔향은 장식']];let kind=0,start=performance.now();function fill(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function stroke(x1,y1,x2,y2,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function bg(){fill(0,0,920,440,'#382933');for(let i=0;i<18;i++)fill(i*54,72+(i%3)*48,35,2,'#805963');fill(0,325,920,115,'#211923');fill(0,323,920,4,'#aa7363')}function actor(){const X=150,Y=322,robe=['#3e4656','#546079','#725743'][kind];fill(X-26,Y-158,52,88,robe);fill(X-19,Y-202,38,44,'#d0a884');fill(X-29,Y-221,58,19,kind===2?'#71513a':'#25242d');fill(X-23,Y-70,14,70,'#191820');fill(X+9,Y-70,14,70,'#191820');if(kind===0){fill(X+22,Y-140,37,10,'#30323b');stroke(X+56,Y-135,X+154,Y-184,'#ece6d0',9);stroke(X+58,Y-132,X+155,Y-181,'#8f9aaa',3);fill(X+48,Y-151,16,27,'#b57c42')}if(kind===1)fill(X+30,Y-143,34,13,'#e6c070');if(kind===2)fill(X+28,Y-143,29,29,'#a77949')}function warrior(t){if(t<.42)return;const q=Math.min(1,(t-.42)/.38);ctx.save();ctx.translate(280,242);ctx.rotate(-1.18+q*2);for(let i=0;i<4;i++){ctx.strokeStyle=`rgba(${230-i*25},${155-i*20},${78-i*7},${1-q*.55})`;ctx.lineWidth=11-i*2;ctx.beginPath();ctx.arc(0,0,76+i*12,-.9,.88);ctx.stroke()}ctx.restore();stroke(240,294,400,243,`rgba(125,38,43,${1-q*.4})`,7)}function adept(t){if(t<.35)return;const q=Math.min(1,(t-.35)/1.3),X=215+q*535,Y=220;stroke(211,Y,X,Y,'rgba(183,57,45,.45)',3);fill(X-9,Y-19,18,38,'#f4d68c');fill(X-5,Y-12,10,5,'#b43c38');fill(X-5,Y,10,5,'#b43c38');fill(X-5,Y+12,10,5,'#b43c38')}function monk(t){if(t<.4)return;const q=Math.min(1,(t-.4)/.85);for(let i=0;i<4;i++){ctx.strokeStyle=`rgba(${237-i*20},${190-i*21},${99-i*6},${.86-q*.55})`;ctx.lineWidth=5-i;ctx.beginPath();ctx.ellipse(225,290,24+q*(52+i*27),(24+q*(52+i*27))*.23,0,0,Math.PI*2);ctx.stroke()}}function draw(now){const t=((now-start)/1000)%2.05;bg();actor();if(kind===0)warrior(t);if(kind===1)adept(t);if(kind===2)monk(t);requestAnimationFrame(draw)}tabs.forEach((tab,index)=>tab.addEventListener('click',()=>{kind=index;start=performance.now();tabs.forEach((item,i)=>{item.classList.toggle('active',i===index);item.setAttribute('aria-selected',i===index?'true':'false')});title.textContent=info[index][0];note.textContent=info[index][1];canvas.setAttribute('aria-label',info[index][0]+' 미리보기')}));root.querySelector('#replay').addEventListener('click',()=>start=performance.now());requestAnimationFrame(draw)})();
</script>
