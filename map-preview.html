<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그슨대 · 흉가 맵 탐색</title><style>*{box-sizing:border-box}body{margin:0;background:#10131c;color:#e0e8df;font:15px/1.7 system-ui}main{max-width:1100px;margin:auto;padding:35px 20px}h1{margin:5px 0;font-size:34px}p{color:#99a5ad}small{color:#90beb1;letter-spacing:3px}.camera{aspect-ratio:16/9;overflow:hidden;border:1px solid #4b615e;position:relative;background:#151c25}.world{position:absolute;width:300%;height:auto;image-rendering:pixelated;max-width:none;user-select:none;pointer-events:none}.toolbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:18px;background:#1a242c}label{display:flex;gap:10px;align-items:center}input{accent-color:#a0c8b5}button{background:#2c4548;border:1px solid #628783;color:#e0e8df;padding:9px 14px;cursor:pointer}figure{margin:30px 0}figure img{width:100%;image-rendering:pixelated;border:1px solid #384c51}figcaption{color:#91a3a8;font-size:13px}a{color:#a0c8b5}</style><main><small>GEUSEUNDAE / MAP STUDY 002</small><h1>화면 너머로 이어지는 흉가.</h1><p>아래 창은 맵의 일부만 보여줍니다. 카메라를 움직여 대문 → 앞마당 → 본채 → 뒤뜰을 살펴보세요.</p><div class="camera"><img class="world" src="assets/maps/haunted-courtyard-v2.png" alt="캐릭터와 몹을 제외한 한국 흉가 횡스크롤 맵"></div><div class="toolbar"><label>좌우 <input id="x" aria-label="카메라 좌우" type="range" min="0" max="1" step="0.001" value="0"></label><label>높이 <input id="y" aria-label="카메라 높이" type="range" min="0" max="1" step="0.001" value="1"></label><button id="auto">자동 둘러보기</button></div><p>화살표 키로도 이동할 수 있습니다. 카메라 크기는 맵 가로의 약 ⅓입니다.</p><figure><img src="assets/maps/haunted-courtyard-v2.png" alt="흉가 전체 맵 개요"><figcaption>전체 맵 · 카메라 창보다 넓고 높은 공간에 이동 경로와 발판을 배치한 시각 시안입니다. 실제 충돌·이동 구현 전 단계입니다.</figcaption></figure><a href="assets/maps/haunted-courtyard-v2.png" download>전체 맵 PNG ↓</a></main><script>
const img=document.querySelector('.world'),cam=document.querySelector('.camera'),x=document.querySelector('#x'),y=document.querySelector('#y'),button=document.querySelector('#auto');let auto=false,last=0,phase=0;
function update(){const width=cam.clientWidth*3,height=img.naturalWidth?width*img.naturalHeight/img.naturalWidth:0;img.style.left=-(width-cam.clientWidth)*Number(x.value)+'px';img.style.top=-Math.max(0,height-cam.clientHeight)*Number(y.value)+'px'}img.onload=update;window.onresize=update;x.oninput=y.oninput=()=>{auto=false;button.textContent='자동 둘러보기';update()};button.onclick=()=>{auto=!auto;button.textContent=auto?'둘러보기 멈춤':'자동 둘러보기'};window.addEventListener('keydown',e=>{if(!e.key.startsWith('Arrow'))return;e.preventDefault();auto=false;if(e.key==='ArrowRight')x.value=Math.min(1,Number(x.value)+.015);if(e.key==='ArrowLeft')x.value=Math.max(0,Number(x.value)-.015);if(e.key==='ArrowDown')y.value=Math.min(1,Number(y.value)+.03);if(e.key==='ArrowUp')y.value=Math.max(0,Number(y.value)-.03);update()});function tick(t){if(auto){phase+=Math.min(.05,(t-last)/1000)/12;x.value=(Math.sin(phase-Math.PI/2)+1)/2;update()}last=t;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
